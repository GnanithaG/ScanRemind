[project]
name = "scanremind"
version = "2.0.0"
description = "Scan a QR code, set a reminder, get an email when it's due."
readme = "README.md"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S104"]  # binding to 0.0.0.0 is intended inside Docker

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S608"]
"scanremind/db.py" = ["S608"]  # table/column names come from constants, not user input
