{% extends "base.html" %}
{% block title %}Manage reminders · ScanRemind{% endblock %}
{% block content %}
<h1>Manage your reminders</h1>
<p class="lead">Enter your email and we'll send you a one-time code to see and delete your reminders. No account needed.</p>
{% include "_flashes.html" %}
<form action="{{ url_for('auth.send_otp') }}" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" autocomplete="email" required>
    <button type="submit">Send code</button>
</form>
<a href="{{ url_for('reminders.set_reminder') }}" class="back-button">← Back</a>
{% endblock %}
